<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart Website Translator</title>
  <link rel="icon" type="image/png" href="../../assets/icon16.png">
  <link rel="stylesheet" href="../styles/common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div class="logo brand-logo"><img src="../../assets/brand/smart-website-translator-mark-128.png" alt="Smart Website Translator"></div>
      <div><h1>Smart Website Translator</h1><p class="muted">Translate any webpage instantly</p></div>
    </header>
    <section class="card activation-card" id="activationCard">
      <div class="activation-brand"><img src="../../assets/brand/smart-website-translator-mark-128.png" alt="Smart Website Translator"></div>
      <h2>Activate Smart Website Translator</h2>
      <p class="hint">Enter your Activation Key to activate the extension.</p>
      <label for="activationKey">Activation Key</label>
      <input id="activationKey" type="text" autocomplete="off" spellcheck="false" placeholder="AA11-123456-1234-123ABC" maxlength="25">
      <p class="activation-format">Format: AA11-123456-1234-123ABC</p>
      <button class="button primary" id="activate">Activate</button>
      <div id="activationStatus" class="status" role="status"></div>
    </section>
    <section class="license-pill" id="licensePill" hidden></section>
    <section class="card welcome-card" id="welcomeCard" hidden><strong id="welcomeName"></strong><span id="welcomeEmail"></span><small>Smart Website Translator is ready.</small></section>
    <div id="translatorContent" hidden>
      <section class="card page-card"><span class="muted">CURRENT PAGE</span><strong id="pageName">Checking page...</strong></section>
      <section class="card">
      <label for="language">Target language</label>
      <select id="language"></select>
      <label>Translation mode</label>
      <div class="segmented"><label><input type="radio" name="mode" value="free" checked><span>Free</span></label><label><input type="radio" name="mode" value="ai"><span>AI</span></label></div>
      <div class="actions"><button class="button primary" id="translate">Translate Page</button><button class="button secondary" id="restore">Restore</button></div>
      <div id="status" class="status" role="status"></div>
      </section>
    </div>
    <footer><button class="settings" id="settings">Settings</button><span class="muted">Ctrl+Shift+T</span></footer>
  </main>
  <script src="../utils/languages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
