<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart Website Translator Admin</title>
  <link rel="icon" type="image/png" href="../assets/icon16.png"><link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="loginView" class="auth-shell"><section class="auth-card"><img class="auth-logo" src="../assets/brand/smart-website-translator.png" alt="Smart Website Translator"><p class="eyebrow">SMART WEBSITE TRANSLATOR</p><h1>Admin Console</h1><p class="subtle">Secure license operations for the modern web.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button><p id="loginStatus" class="status"></p></form></section></div>
  <div id="appView" class="app-shell" hidden><aside class="sidebar"><div class="side-brand"><img src="../assets/brand/smart-website-translator-mark-128.png" alt="Smart Website Translator"><div><strong>Smart Website<br>Translator</strong><span>Admin Panel</span></div></div><nav><button data-route="dashboard">Dashboard</button><button data-route="keys">Activation Keys</button><button data-route="customers">Customers</button><button data-route="activity">Activity Logs</button><button data-route="settings">Settings</button></nav><button id="logout" class="logout">Log out</button></aside><main class="main"><header class="topbar"><div><p class="eyebrow">CONTROL CENTER</p><h1 id="pageTitle">Dashboard</h1></div><span id="adminEmail" class="user-chip"></span></header><section id="dashboard" class="route"></section><section id="keys" class="route" hidden></section><section id="customers" class="route" hidden></section><section id="activity" class="route" hidden></section><section id="settings" class="route" hidden></section></main></div>
  <script src="config.js"></script><script src="vendor/supabase.min.js"></script><script src="admin.js"></script>
</body>
</html>
